name: MLS Data Scraper

on:
  schedule:
    # 하루 4회 자동 갱신 — UTC 03/09/15/21 = KST 12/18/00/06
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # 수동 실행 가능
  push:
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape-mls.yml'

permissions:
  contents: write

# 동시 실행 방지: 여러 run이 겹쳐 서로의 데이터 커밋을 덮어쓰는 것을 막는다.
concurrency:
  group: scrape-mls
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: |
          cd scraper
          node scrape.js

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "Update MLS data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push

      - name: Purge jsdelivr cache
        run: |
          # 데이터 커밋 후 jsdelivr 캐시를 비워 앱에 즉시 반영 (KBO/kleague와 동일)
          sleep 15
          for f in standings scorers son koreans schedule meta; do
            curl -fsS "https://purge.jsdelivr.net/gh/officealone00/mls-app@main/data/$f.json" || true
            echo ""
          done
