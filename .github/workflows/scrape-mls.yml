name: MLS Data Scraper

on:
  schedule:
    # 하루 4회 자동 갱신 — UTC 03/09/15/21 = KST 12/18/00/06
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # 수동 실행 가능
  push:
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape-mls.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: |
          cd scraper
          node scrape.js

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "Update MLS data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
